# Render Blueprint for the Kiowa Gun Club: API, daily jobs and the four React
# apps (see docs/DEPLOYMENT.md). The PostgreSQL database is hosted on Neon,
# not Render; its connection string is the API's DATABASE_URL secret. Domains:
#   www.kiowagunclub.org    -> www     (public site; the apex still points at the old Wix site)
#   portal.kiowagunclub.org -> portal  (member sign-in, account, status, payment)
#   apply.kiowagunclub.org  -> apply   (membership application form)
#   board.kiowagunclub.org  -> board   (board administration)
#   app.kiowagunclub.org    -> kiowa   (FastAPI)
# Service names match the services already running in the Render workspace, so
# syncing this Blueprint updates them instead of creating duplicates.
# All five must share one parent domain so the API's session cookies are
# same-site for the four apps.

envVarGroups:
  - name: kiowa-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kiowagunclub.org,https://www.kiowagunclub.org,https://portal.kiowagunclub.org,https://apply.kiowagunclub.org,https://board.kiowagunclub.org
      - key: PUBLIC_SITE_URL
        value: https://kiowagunclub.org
      - key: PORTAL_APP_URL
        value: https://portal.kiowagunclub.org
      - key: APPLY_APP_URL
        value: https://apply.kiowagunclub.org
      - key: BOARD_APP_URL
        value: https://board.kiowagunclub.org
      - key: API_PUBLIC_URL
        value: https://app.kiowagunclub.org
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/kiowa-storage
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM_NAME
        value: Kiowa Gun Club
      # Texts are sent by the httpSMS app on the club's Android phone (httpsms.com).
      - key: SMS_PROVIDER
        value: httpsms
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: kiowa
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Runs before each deploy goes live; a failed migration stops the deploy.
    preDeployCommand: alembic upgrade head && python -m app.cli bootstrap-admin
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*' --no-server-header
    healthCheckPath: /health
    domains:
      - app.kiowagunclub.org
    numInstances: 1
    disk:
      name: kiowa-storage
      mountPath: /var/data/kiowa-storage
      sizeGB: 10
    envVars:
      - fromGroup: kiowa-shared
      # Secrets, entered when the Blueprint is created. Render does not allow
      # sync: false in an environment group; kiowa-daily-jobs reads these from here.
      # DATABASE_URL is the Neon connection string (postgresql://...?sslmode=require).
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: HTTPSMS_API_KEY
        sync: false
      # The club phone's number in +1 format, e.g. +16205550100.
      - key: HTTPSMS_FROM_NUMBER
        sync: false
      # Signing key of the httpSMS webhook pointed at /api/webhooks/sms/httpsms.
      - key: HTTPSMS_WEBHOOK_SIGNING_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # First deploy only: create the initial administrator, then delete these.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # Daily renewal reminders, NRA expiration check, annual termination sweep,
  # Stripe reconciliation and session cleanup. 13:00 UTC = 8 AM CDT / 7 AM CST.
  - type: cron
    name: kiowa-daily-jobs
    runtime: python
    rootDir: backend
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs daily
    envVars:
      - fromGroup: kiowa-shared
      - key: DATABASE_URL
        fromService:
          type: web
          name: kiowa
          envVarKey: DATABASE_URL
      - key: STRIPE_SECRET_KEY
        fromService:
          type: web
          name: kiowa
          envVarKey: STRIPE_SECRET_KEY
      - key: STRIPE_WEBHOOK_SECRET
        fromService:
          type: web
          name: kiowa
          envVarKey: STRIPE_WEBHOOK_SECRET
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: kiowa
          envVarKey: RESEND_API_KEY
      - key: RESEND_WEBHOOK_SECRET
        fromService:
          type: web
          name: kiowa
          envVarKey: RESEND_WEBHOOK_SECRET
      - key: EMAIL_FROM_ADDRESS
        fromService:
          type: web
          name: kiowa
          envVarKey: EMAIL_FROM_ADDRESS
      - key: EMAIL_REPLY_TO
        fromService:
          type: web
          name: kiowa
          envVarKey: EMAIL_REPLY_TO
      - key: HTTPSMS_API_KEY
        fromService:
          type: web
          name: kiowa
          envVarKey: HTTPSMS_API_KEY
      - key: HTTPSMS_FROM_NUMBER
        fromService:
          type: web
          name: kiowa
          envVarKey: HTTPSMS_FROM_NUMBER
      - key: SENTRY_DSN
        fromService:
          type: web
          name: kiowa
          envVarKey: SENTRY_DSN

  # The four React apps. Each builds from the repo root (not rootDir) because
  # files outside a rootDir are unavailable at build time, and every app
  # imports apps/shared. buildFilter redeploys an app when it or shared changes.
  # If the API domain changes, update the CSP below.
  - type: web
    name: www
    runtime: static
    buildCommand: npm ci --prefix apps/www && npm run build --prefix apps/www
    staticPublishPath: apps/www/dist
    buildFilter:
      paths:
        - apps/www/**
        - apps/shared/**
    domains:
      - www.kiowagunclub.org
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    # SPA routing: Render serves real files first, then falls back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://app.kiowagunclub.org; connect-src 'self' https://app.kiowagunclub.org; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: portal
    runtime: static
    buildCommand: npm ci --prefix apps/portal && npm run build --prefix apps/portal
    staticPublishPath: apps/portal/dist
    buildFilter:
      paths:
        - apps/portal/**
        - apps/shared/**
    domains:
      - portal.kiowagunclub.org
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    # SPA routing: Render serves real files first, then falls back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://app.kiowagunclub.org; connect-src 'self' https://app.kiowagunclub.org; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: apply
    runtime: static
    buildCommand: npm ci --prefix apps/apply && npm run build --prefix apps/apply
    staticPublishPath: apps/apply/dist
    buildFilter:
      paths:
        - apps/apply/**
        - apps/shared/**
    domains:
      - apply.kiowagunclub.org
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    # SPA routing: Render serves real files first, then falls back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://app.kiowagunclub.org; connect-src 'self' https://app.kiowagunclub.org; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: board
    runtime: static
    buildCommand: npm ci --prefix apps/board && npm run build --prefix apps/board
    staticPublishPath: apps/board/dist
    buildFilter:
      paths:
        - apps/board/**
        - apps/shared/**
    domains:
      - board.kiowagunclub.org
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    # SPA routing: Render serves real files first, then falls back to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://app.kiowagunclub.org; connect-src 'self' https://app.kiowagunclub.org; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
