# Render Blueprint for the Kiowa Gun Club API, daily jobs and database.
#
# The four React apps are hosted on Cloudflare Pages, not here
# (see docs/DEPLOYMENT.md). Domains:
#   kiowagunclub.org        -> Pages: apps/www     (public site)
#   portal.kiowagunclub.org -> Pages: apps/portal  (member sign-in, account, status, payment)
#   apply.kiowagunclub.org  -> Pages: apps/apply   (membership application form)
#   board.kiowagunclub.org  -> Pages: apps/board   (board administration)
#   api.kiowagunclub.org    -> Render: kiowa-api   (FastAPI)
# All five must share one parent domain so the API's session cookies are
# same-site for the four apps.

envVarGroups:
  - name: kiowa-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kiowagunclub.org,https://www.kiowagunclub.org,https://portal.kiowagunclub.org,https://apply.kiowagunclub.org,https://board.kiowagunclub.org
      - key: PUBLIC_SITE_URL
        value: https://kiowagunclub.org
      - key: PORTAL_APP_URL
        value: https://portal.kiowagunclub.org
      - key: APPLY_APP_URL
        value: https://apply.kiowagunclub.org
      - key: BOARD_APP_URL
        value: https://board.kiowagunclub.org
      - key: API_PUBLIC_URL
        value: https://api.kiowagunclub.org
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/kiowa-storage
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: EMAIL_FROM_NAME
        value: Kiowa Gun Club
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: VERIPHONE_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false

databases:
  - name: kiowa-db
    databaseName: kiowa_gun_club
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: kiowa-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Runs before each deploy goes live; a failed migration stops the deploy.
    preDeployCommand: alembic upgrade head && python -m app.cli bootstrap-admin
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*' --no-server-header
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: kiowa-storage
      mountPath: /var/data/kiowa-storage
      sizeGB: 10
    envVars:
      - fromGroup: kiowa-shared
      - key: DATABASE_URL
        fromDatabase:
          name: kiowa-db
          property: connectionString
      # First deploy only: create the initial administrator, then delete these.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # Daily renewal reminders, NRA expiration check, annual termination sweep,
  # Stripe reconciliation and session cleanup. 13:00 UTC = 8 AM CDT / 7 AM CST.
  - type: cron
    name: kiowa-daily-jobs
    runtime: python
    rootDir: backend
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs daily
    envVars:
      - fromGroup: kiowa-shared
      - key: DATABASE_URL
        fromDatabase:
          name: kiowa-db
          property: connectionString
